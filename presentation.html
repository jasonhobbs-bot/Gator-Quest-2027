>b.onclick=()=>{const v=b.dataset.choice;if(['pick','experiment'].includes(r.type))selected=[v];else if(selected.includes(v))selected=selected.filter(x=>x!==v);else selected.push(v);feedback='';guided()});if($('#check'))$('#check').onclick=()=>{if(r.type==='experiment'&&trials.length!==r.locations.length)feedback='Run all trials first.';else{solved=answerOK(r,selected);feedback=solved?'Excellent! Challenge complete.':r.hint}guided()};if($('#clear'))$('#clear').onclick=()=>{selected=[];feedback='';guided()};if($('#hint'))$('#hint').onclick=()=>{feedback=r.hint;guided()};if($('#advance'))$('#advance').onclick=()=>{step++;selected=[];trials=[];solved=false;feedback='';if(step===3){initTrail();renderTrail()}else guided()}}
