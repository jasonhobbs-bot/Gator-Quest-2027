function memoryLoop(){if(mode!=='memory'||paused)return;const t=performance.now(),dt=clamp((t-mem.last)/1000,0,.1);mem.last=t;mem.time=Math.max(0,mem.time-dt);if(mem.wait>0){mem.wait-=dt;if(mem.wait<=0){mem.open=[];renderMemory()}}const n=$('#time');if(n)n.textContent=Math.ceil(mem.time)+'s';if(mem.time<=0){endRound(mem.cards.filter(c=>c.matched).length/2,mem.pairs,0);return}frame=requestAnimationFrame(memoryLoop)}
function endRound(score,target,best){if(!sessionActive||mode==='result')return;cancelAnimationFrame(frame);mode='result';paused=false;const stars=score>=target?3:score>=Math.ceil(target*.5)?2:1;total+=score;medals[round]=stars;set(strip()+'<section class="panel result"><p class="eyebrow">LEVEL '+(round+1)+' COMPLETE</p><div class="medal">'+(stars===3?'🏆':'⭐')+'</div><div class="stars">'+('★'.repeat(stars))+'<span style="opacity:.25">'+('★'.repeat(3-stars))+'</span></div><h1>'+(stars===3?'Fantastic!':'Great effort!')+'</h1><div class="scorebig">'+score+' / '+target+'</div><p>New challenge unlocked!'+(best>2?' Best combo: '+best+'!':'')+'</p><div class="actions"><button id="next">Next level →</button></div><p class="muted">Bonus levels keep going until your ten-minute session ends.</p></section>');bindPause();$('#next').onclick=nextRound;advanceAt=performance.now()+4500;sound(880)}
function final(){mode='final';const pair=ids();set('<section class="panel result"><div class="medal">🏅</div><p class="eyebrow">Gator arcade champion</p><h1>Ten-minute adventure complete!</h1><div class="scorebig">'+medals.length+' levels • '+medals.reduce((n,x)=>n+x,0)+' stars</div><p>You explored '+esc(themes[pair[0]].name)+' and '+esc(themes[pair[1]].name)+'.</p><div class="books">'+pair.map((id,i)=>(i?'<div class="versus">VS</div>':'')+'<div class="book">'+cover(id)+'<strong>'+esc(title(id))+'</strong></div>').join('')+'</div><h2>Tell a friend one thing you remember from each book.</h2><p class="muted">No student information, game score or official vote was submitted.</p><div class="actions"><button id="again">Start another adventure</button><button class="secondary" id="done">Next student</button></div></section>');$('#again').onclick=beginSession;$('#done').onclick=home}
function makeMaze(n){const walls=Array.from({length:n*n},()=>[true,true,true,true]),seen=new Set([0]),stack=[0],dirs=[[0,-1],[1,0],[0,1],[-1,0]];while(stack.length){const i=stack.at(-1),x=i%n,y=Math.floor(i/n),opts=dirs.map(([dx,dy],d)=>({x:x+dx,y:y+dy,d})).filter(v=>v.x>=0&&v.y>=0&&v.x<n&&v.y<n&&!seen.has(v.y*n+v.x));if(!opts.length){stack.pop();continue}const c=choice(opts),j=c.y*n+c.x;walls[i][c.d]=false;walls[j][(c.d+2)%4]=false;seen.add(j);stack.push(j)}return walls}
function startMaze(){mode='maze';const n=Math.min(9,(grade<2?4:grade<4?5:6)+Math.min(config(grade,round).tier,2)),count=grade<2?2:grade<4?3:4,pool=shuffle(Array.from({length:n*n-2},(_,i)=>i+1));E={n,walls:makeMaze(n),pos:0,exit:n*n-1,items:pool.slice(0,count).map((i,k)=>({i,icon:themes[ids()[k%2]].items[k%4],found:false})),score:0,target:count+1,time:110+grade*3,last:performance.now(),tip:'Collect every treasure, then reach the golden door.'};renderMaze();frame=requestAnimationFrame(extraLoop)}
function mazeMove(d){if(paused||mode!=='maze')return;const v=E;if(v.walls[v.pos][d]){v.tip='Wall! Try another path.';renderMaze();return}v.pos+=[-v.n,1,v.n,-1][d];const t=v.items.find(x=>x.i===v.pos&&!x.found);if(t){t.found=true;v.score++;sound(620);v.tip='Treasure found!'}else v.tip='Keep exploring.';if(v.pos===v.exit){if(v.score===v.target-1){endRound(v.target,v.target,0);return}v.tip='Find the remaining treasures first.'}renderMaze()}
function renderMaze(){const v=E;set(hud('Maze Explorer')+'<p class="tip">'+esc(v.tip)+'</p><div class="maze-board" style="--n:'+v.n+'">'+v.walls.map((walls,i)=>{const t=v.items.find(x=>x.i===i&&!x.found),player=v.pos===i,exit=v.exit===i,adj=[v.pos-v.n,v.pos+1,v.pos+v.n,v.pos-1].indexOf(i),legal=adj>=0&&!v.walls[v.pos][adj];return '<button class="maze-cell '+(player?'player ':'')+(exit?'exit ':'')+(t?'treasure':'')+'" data-cell="'+i+'" '+(legal?'':'disabled')+' style="'+walls.map((w,k)=>w?'border-'+['top','right','bottom','left'][k]+':4px solid #236359;':'').join('')+'" aria-label="'+esc(player?'Gator':exit?'Golden door':t?'Treasure '+t.icon:'Path')+'">'+(player?'🐊':exit?'🚪':t?esc(t.icon):'·')+'</button>'}).join('')+'</div><div class="controls"><button class="secondary" data-dir="3">◀</button><button class="secondary" data-dir="0">▲</button><button class="secondary" data-dir="2">▼</button><button class="secondary" data-dir="1">▶</button></div>');bindPause();main.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>mazeMove(Number(b.dataset.dir)));main.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{const d=[v.pos-v.n,v.pos+1,v.pos+v.n,v.pos-1].indexOf(Number(b.dataset.cell));if(d>=0)mazeMove(d)});extraHud()}
function uniqueItems(){const a=themes[ids()[0]].items,b=themes[ids()[1]].items;return [a.filter(x=>!b.includes(x)),b.filter(x=>!a.includes(x))].map((v,i)=>v.length?v:[themes[ids()[i]].icon+' '+(i+1)])}
function sortToken(){E.side=Math.random()<.5?0:1;E.token=choice(E.pool[E.side]);E.wait=grade<2?10:grade<4?7:Math.max(3.2,6-config(grade,round).tier*.5)}
function startSort(){mode='sort';E={pool:uniqueItems(),time:85+grade*3,score:0,target:16+grade*3+config(grade,round).tier*4,last:performance.now(),combo:0,best:0,tip:'Match the treasure to its book chest.'};sortToken();renderSort();frame=requestAnimationFrame(extraLoop)}
function sortPick(side){if(paused||mode!=='sort')return;const v=E;if(side===v.side){v.score++;v.combo++;v.best=Math.max(v.best,v.combo);v.tip='Great match!';sound(600);if(v.score>=v.target){endRound(v.score,v.target,v.best);return}sortToken()}else{v.combo=0;v.tip='Try the other chest.';sound(180)}renderSort()}
function renderSort(){const v=E;set(hud('Book Sort Sprint')+'<p class="tip">'+esc(v.tip)+'</p><div class="sort-token" id="sort-token"><span>'+esc(v.token)+'</span><small>Which book world?</small></div><div class="sort-chests">'+ids().map((id,i)=>'<button class="chest" data-chest="'+i+'"><span class="chest-icon">🧰</span>'+cover(id)+'<strong>'+esc(title(id))+'</strong><small>'+esc(v.pool[i].join('  '))+'</small></button>').join('')+'</div><p class="tip">Tap a chest. Combo: '+v.combo+'</p>');bindPause();main.querySelectorAll('[data-chest]').forEach(b=>b.onclick=()=>sortPick(Number(b.dataset.chest)));extraHud()}
function popTargets(){const v=E,indices=shuffle(Array.from({length:v.cells},(_,i)=>i)),pool=[...themes[ids()[0]].items,...themes[ids()[1]].items];v.active=indices.slice(0,v.count).map(i=>({i,icon:choice(pool),bad:false}));if(grade>=2&&Math.random()<.8)v.active.push({i:indices[v.count],icon:'⛔',bad:true});v.wait=grade<2?3.8:Math.max(.9,2.8-grade*.18-config(grade,round).tier*.25)}
function startPop(){mode='pop';E={time:90+grade*2,score:0,target:22+grade*4+config(grade,round).tier*6,last:performance.now(),cells:grade<2?9:grade<4?12:16,count:grade<2?2:grade<4?3:4,combo:0,best:0,tip:'Tap glowing treasures! Avoid red signs.'};popTargets();renderPop();frame=requestAnimationFrame(extraLoop)}
function tapPop(i){if(paused||mode!=='pop')return;const v=E,t=v.active.find(a=>a.i===i);if(!t)return;if(t.bad){v.combo=0;v.tip='Watch out for red signs!';sound(160)}else{v.score++;v.combo++;v.best=Math.max(v.best,v.combo);v.tip=v.combo>2?v.combo+'× combo!':'Treasure collected!';sound(550+v.combo*20);if(v.score>=v.target){endRound(v.score,v.target,v.best);return}}v.active=v.active.filter(a=>a.i!==i);if(!v.active.some(a=>!a.bad))popTargets();renderPop()}
function renderPop(){const v=E;set(hud('Treasure Pop')+'<p class="tip">'+esc(v.tip)+'</p><div class="pop-board" style="--cols:'+(v.cells===9?3:4)+'">'+Array.from({length:v.cells},(_,i)=>{const t=v.active.find(a=>a.i===i);return '<button class="pop-cell '+(t?t.bad?'bad-target':'glow':'')+'" data-pop="'+i+'" '+(!t?'disabled':'')+' aria-label="'+(t?t.bad?'Avoid red target':'Collect '+esc(t.icon):'Empty')+'">'+(t?esc(t.icon):'✦')+'</button>'}).join('')+'</div><p class="tip">Combo '+v.combo+' • Targets move automatically</p>');bindPause();main.querySelectorAll('[data-pop]').forEach(b=>b.onclick=()=>tapPop(Number(b.dataset.pop)));extraHud()}
function extraHud(){const v=E;if(!v)return;$('#score').textContent=v.score+' / '+v.target;$('#time').textContent=Math.ceil(v.time)+'s';$('#bar').style.width=Math.min(100,v.score/v.target*100)+'%'}
function extraLoop(t){if(paused||!['maze','sort','pop'].includes(mode))return;const v=E,dt=clamp((t-v.last)/1000,0,.1);v.last=t;v.time=Math.max(0,v.time-dt);if(v.time<=0){endRound(v.score,v.target,v.best||0);return}if(mode==='sort'||mode==='pop'){v.wait-=dt;if(v.wait<=0){v.combo=0;if(mode==='sort'){sortToken();v.tip='New treasure!';renderSort()}else{popTargets();renderPop()}}}extraHud();frame=requestAnimationFrame(extraLoop)}
function startSpecial(k){
 mode='special';const c=config(grade,round);E={kind:k,n:grade<2?3:grade<4?4:5,time:95+grade*4,score:0,target:(k===7||k===13?14:k===10||k===12?10:4)+Math.floor(grade/2)+c.tier,last:performance.now(),tier:c.tier,combo:0,best:0,tip:''};
 if(k===7){E.jump=0;E.obstacles=[];E.spawn=1;E.elapsed=0;E.flash=0}
 else if(k===13){E.elapsed=0;E.beat=-1;E.period=Math.max(.65,1.7-grade*.10-c.tier*.08)}
 else freshPuzzle();
 renderSpecial();frame=requestAnimationFrame(specialLoop)
}
function earnSpecial(){E.score++;E.combo++;E.best=Math.max(E.best,E.combo);sound(550+Math.min(E.combo,8)*35);if(E.score>=E.target){endRound(E.score,E.target,E.best);return true}return false}
function freshPuzzle(){
 const v=E,k=v.kind,n=v.n,pool=[...new Set([...themes[ids()[0]].items,...themes[ids()[1]].items])];
 if(k===6){v.pattern=new Set(shuffle(Array.from({length:n*n},(_,i)=>i)).slice(0,Math.min(n*n-1,2+grade+v.tier)));v.selected=new Set();v.tip='Copy the pattern onto its mirror side.'}
 if(k===8){v.tiles=Array.from({length:3+Math.floor(grade/2)+Math.min(v.tier,2)},()=>Math.floor(Math.random()*4));if(v.tiles.every(x=>x%2===0))v.tiles[0]=1;v.tip='Rotate every bridge piece to make a continuous horizontal path.'}
 if(k===9){v.path=[];let N=n+1,i=Math.floor(Math.random()*N*N);v.traceN=N;v.path.push(i);for(let j=0;j<4+grade+v.tier;j++){const x=i%N,y=Math.floor(i/N),opts=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]].filter(([a,b])=>a>=0&&a<N&&b>=0&&b<N&&!v.path.includes(b*N+a));if(!opts.length)break;const [xx,yy]=choice(opts);i=yy*N+xx;v.path.push(i)}v.step=0;v.tip='Tap the numbered glowing dots in order.'}
 if(k===10||k===12){v.size=n+1;const cells=v.size*v.size,spots=shuffle(Array.from({length:cells},(_,i)=>i)).slice(0,4+Math.floor(grade/2));v.cells=Array.from({length:cells},(_,i)=>({open:false,item:spots.includes(i)?choice(pool):null}));v.light=Math.floor(cells/2);v.tip=k===10?'Excavate the soil and uncover hidden book treasures.':'Move your lantern and collect revealed treasures.'}
 if(k===11){v.pool=pool.slice(0,Math.min(pool.length,3+Math.floor(grade/2)));v.order=Array.from({length:Math.min(7,2+Math.floor(grade/2)+v.tier)},()=>choice(v.pool));v.tray=[];v.peek=grade<2?99:Math.max(2.2,6-grade*.4);v.tip='Remember the order. Build the tray from left to right.'}
}
function isLit(i){const n=E.size,x=i%n,y=Math.floor(i/n),xx=E.light%n,yy=Math.floor(E.light/n);return Math.abs(x-xx)+Math.abs(y-yy)<=(grade<2?2:1)}
function specialPick(i){if(paused||mode!=='special')return;const v=E,k=v.kind;let complete=false;
 if(k===6){const mirror=Math.floor(i/v.n)*v.n+v.n-1-i%v.n;if(v.pattern.has(mirror)){v.selected.add(i);complete=v.selected.size===v.pattern.size}else{v.tip='Look across the mirror line.';v.combo=0}}
 if(k===8){v.tiles[i]=(v.tiles[i]+1)%4;complete=v.tiles.every(x=>x%2===0)}
 if(k===9){if(v.path[v.step]!==i)return;v.step++;complete=v.step===v.path.length}
 if(k===10){const c=v.cells[i];if(c.open)return;c.open=true;if(c.item&&earnSpecial())return;if(v.cells.every(x=>!x.item||x.open))freshPuzzle()}
 if(k===11){if(v.pool[i]!==v.order[v.tray.length]){v.tip='Try the next ingredient again.';v.combo=0}else{v.tray.push(v.pool[i]);complete=v.tray.length===v.order.length}}
 if(k===12){const c=v.cells[i];if(isLit(i)&&c.item&&!c.open){c.open=true;if(earnSpecial())return}else v.light=i;if(v.cells.every(x=>!x.item||x.open))freshPuzzle()}
 if(complete){if(earnSpecial())return;freshPuzzle()}sound(440);renderSpecial()
}
function specialAction(){if(paused||mode!=='special')return;const v=E;if(v.kind===7){if(v.jump<=0){v.jump=.85;sound(420)}}else if(v.kind===13){const phase=v.elapsed/v.period,beat=Math.floor(phase),tolerance=grade<2?.28:grade<4?.2:.14;if(v.beat===beat)return;v.beat=beat;if(Math.abs(phase%1-.5)<=tolerance){v.tip='On the beat!';if(earnSpecial())return}else{v.tip='Watch the gold zone.';v.combo=0;sound(170)}$('#special-tip').textContent=v.tip}}
function renderSpecial(){const v=E,k=v.kind,n=v.n;let body='';
 const grid=(N,cells,cls='')=>'<div class="special-grid '+cls+'" style="--n:'+N+'">'+cells+'</div>';
 const cells=(N,fn)=>Array.from({length:N*N},(_,i)=>fn(i)).join('');
 const tile=(i,txt,cls='')=>'<button class="special-cell '+cls+'" data-special="'+i+'" aria-label="Play tile '+(i+1)+'">'+esc(txt)+'</button>';
 if(k===6)body='<div class="mirror-wrap">'+grid(n,cells(n,i=>'<div class="special-cell '+(v.pattern.has(i)?'lit':'')+'">'+(v.pattern.has(i)?esc(roundTheme().icon):'·')+'</div>'))+'<strong>↔</strong>'+grid(n,cells(n,i=>tile(i,v.selected.has(i)?roundTheme().icon:'·',v.selected.has(i)?'lit':'')))+'</div>';
 if(k===7)body='<div class="arena"><canvas id="special-canvas" width="960" height="540" aria-label="Jump over obstacles"></canvas></div><div class="controls"><button id="special-action">⬆ JUMP</button></div>';
 if(k===8)body='<div class="bridge-wrap"><span>🐊</span>'+v.tiles.map((x,i)=>'<button class="bridge-tile '+(x%2===0?'lit':'')+'" data-special="'+i+'" aria-label="Rotate bridge piece '+(i+1)+'"><span style="transform:rotate('+x*90+'deg)">━</span></button>').join('')+'<span>🏁</span></div>';
 if(k===9)body=grid(v.traceN,cells(v.traceN,i=>{const j=v.path.indexOf(i);return tile(i,j<0?'·':j<v.step?'✓':j+1,j<0?'dark':j===v.step?'lit':j<v.step?'done':'future')}),'trace-game');
 if(k===10)body=grid(v.size,cells(v.size,i=>{const c=v.cells[i];return tile(i,c.open?c.item||'·':'🟫',c.open?'lit':'dirt')}),'dig-game');
 if(k===11)body='<div class="order-row" id="recipe">'+v.order.map((x,i)=>'<span class="order-slot">'+(v.peek>0||grade<2||i<v.tray.length?esc(x):'?')+'</span>').join('')+'</div><div class="order-row">'+v.order.map((x,i)=>'<span class="order-slot tray">'+esc(v.tray[i]||'·')+'</span>').join('')+'</div><div class="ingredient-row">'+v.pool.map((x,i)=>tile(i,x,'lit')).join('')+'</div>';
 if(k===12)body=grid(v.size,cells(v.size,i=>{const c=v.cells[i];return tile(i,isLit(i)?c.open?'✓':c.item||(i===v.light?'🔦':'·'):'',isLit(i)?'lit':'dark')}),'lantern-game');
 if(k===13){const width=grade<2?56:grade<4?40:28;body='<div class="beat-track"><div class="beat-zone" style="left:'+(100-width)/2+'%;width:'+width+'%"></div><div class="beat-dot" id="beat-dot"></div></div><div class="controls"><button class="drum" id="special-action">🥁 TAP!</button></div>'}
 set(hud(gameName(k))+'<p class="tip" id="special-tip">'+esc(v.tip||descs[k])+'</p><div class="special-board" style="--theme:'+esc(roundTheme().sky)+'">'+body+'</div>');
 bindPause();main.querySelectorAll('[data-special]').forEach(b=>b.onclick=()=>specialPick(Number(b.dataset.special)));
 if(k===7||k===13)$('#special-action').onclick=specialAction;
 if(k===7){$('#special-canvas').onpointerdown=specialAction;drawSpecialJump()}
 extraHud()
}
function drawSpecialJump(){const cv=$('#special-canvas');if(!cv)return;const ctx=cv.getContext('2d'),v=E,t=roundTheme();background(ctx,t,{elapsed:v.elapsed,mode:'catch',c:{lanes:3}});rr(ctx,0,H-88,W,88,0,'#284c49');const y=v.jump>0?Math.sin(v.jump/.85*Math.PI)*145:0;ellipse(ctx,145,H-63,42,10,'#0005');ctx.font='65px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐊',145,H-110-y);for(const o of v.obstacles)ctx.fillText(o.icon,o.x,H-108);if(v.flash>0){ctx.strokeStyle='#ffa573';ctx.lineWidth=10;ctx.strokeRect(0,0,W,H)}}
function specialLoop(t){if(paused||mode!=='special'||!sessionActive)return;const v=E,dt=clamp((t-v.last)/1000,0,.1);v.last=t;v.time=Math.max(0,v.time-dt);if(v.time<=0){endRound(v.score,v.target,v.best);return}
 if(v.kind===7){v.elapsed+=dt;v.jump=Math.max(0,v.jump-dt);v.flash=Math.max(0,v.flash-dt);v.spawn-=dt;if(v.spawn<=0){v.obstacles.push({x:W+40,icon:choice(['🪵','🪨','📦']),hit:false});v.spawn=Math.max(.9,2.8-grade*.14-v.tier*.18)}for(const o of v.obstacles){o.x-=dt*(225+grade*20+v.tier*32);if(!o.hit&&o.x<180&&o.x>100){o.hit=true;if(v.jump>.08&&v.jump<.8){if(earnSpecial())return}else{v.combo=0;v.flash=.22;sound(160)}}}v.obstacles=v.obstacles.filter(o=>o.x>-70);drawSpecialJump()}
 if(v.kind===11&&v.peek>0&&grade>=2){v.peek=Math.max(0,v.peek-dt);if(v.peek===0)$('#recipe').innerHTML=v.order.map((x,i)=>'<span class="order-slot">'+(i<v.tray.length?esc(x):'?')+'</span>').join('')}
 if(v.kind===13){v.elapsed+=dt;$('#beat-dot').style.left=((v.elapsed/v.period)%1*100)+'%'}
 extraHud();frame=requestAnimationFrame(specialLoop)
}

document.addEventListener('keydown',e=>{if(mode==='special'&&!paused&&e.code==='Space'&&[7,13].includes(E.kind)){e.preventDefault();specialAction();return}if(mode==='maze'&&!paused&&['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].includes(e.key)){e.preventDefault();mazeMove(['ArrowUp','ArrowRight','ArrowDown','ArrowLeft'].indexOf(e.key));return}if(mode==='motion'&&!paused&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();shift(e.key==='ArrowLeft'?-1:1)}});
setInterval(sessionTick,200);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&sessionActive&&!paused)pauseGame()});
home();
})();</script></body></html>
